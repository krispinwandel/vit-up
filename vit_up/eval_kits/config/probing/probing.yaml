# Linear probing on frozen features, e.g.
#   python -m vit_up.eval_kits.probing_toolkit.run_probing model=dinov3_splus/vit_up \
#     schedule/mode=train schedule/dataset=voc dataset_evaluation=voc
# Modes: train (train a head, then evaluate it) or eval (evaluate a pretrained head).
defaults:
  - schedule/mode: train
  - schedule/dataset: voc
  - dataset_evaluation: voc
  - /model@model: dinov3_splus/vit_up
  - backbone: base
  - optimizer: adamw
  - dataloader@train_dataloader: train
  - dataloader@val_dataloader: val
  - _self_

mode: ${hydra:runtime.choices.schedule/mode}
dataset: ${hydra:runtime.choices.schedule/dataset}
task: seg
data_root: data
output_dir: outputs/eval/probing

seed: 42
sanity: false
accumulate_grad_batches: 1
num_epochs: ${schedule.num_epochs}
# Train all epochs, save the head, then evaluate once; > 0 also evaluates every n epochs.
eval_every_n_epochs: 0

optimizer:
  lr: ${schedule.lr}

train_dataloader:
  batch_size: 4
val_dataloader:
  batch_size: 1

img_size: 448
target_size: ${img_size}

metrics:
  seg:
    num_classes: ${dataset_evaluation.num_classes}
  depth:
    min_depth: 1e-3
    max_depth: 10

hydra:
  searchpath:
    - pkg://vit_up.eval_kits.config
  run:
    dir: ${output_dir}/${mode}/${task}/${dataset_evaluation.tag}/${hydra:runtime.choices.model}/${now:%Y-%m-%d_%H-%M-%S}
