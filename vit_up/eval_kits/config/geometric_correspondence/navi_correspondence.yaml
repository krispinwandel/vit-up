# NAVI 3D correspondence recall, e.g.
#   python -m vit_up.eval_kits.geometric_correspondence_toolkit.evaluate_navi_correspondence model=dinov3_splus/vit_up
defaults:
  - /model@model: dinov3_splus/vit_up
  - dataset: navi
  - _self_

data_root: data
output_dir: outputs/eval/navi
random_seed: 8
scale_factor: 0.25
num_corr: 1000
batch_size: 4
device: cuda
input_size: 448
output_size: 112

hydra:
  searchpath:
    - pkg://vit_up.eval_kits.config
  run:
    dir: ${output_dir}/${hydra:runtime.choices.model}/${now:%Y-%m-%d_%H-%M-%S}
