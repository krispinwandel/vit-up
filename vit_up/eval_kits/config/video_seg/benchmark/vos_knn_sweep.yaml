# Sensitivity of the DAVIS k-NN evaluation to its hand-set parameters: LILA's settings (`base`)
# plus one-at-a-time variations (`vary`), applied identically to every model. Features are
# extracted once per grid size and cached; the combined mode averages the branches.
davis_root: ${data_root}/DAVIS2017
split_file: null
# Sequence subset: every third DAVIS-2017 val sequence (10 sequences, 576 frames), so that one
# setting takes ~15-30 s on an RTX 3090. Set sequence_stride: 1 for the full set.
sequence_offset: 0
sequence_stride: 3
max_sequences: null
resize_input: false
resize_input_size: 476
resample_size: 476
resample_patch_size: 14
modes: [dense]                # backbone / dense / combined
alpha_enc: 1.0
alpha_dec: 1.0
base:                         # LILA eval_vosknn.py
  temp: 0.1
  num_nn: 5
  attn_window: 25
  context_size: 7
  feat_grid_size: 60
  center: false               # true: subtract each frame's mean feature before cosine similarity
vary:
  temp: [0.02, 0.05, 0.2, 0.5]
  num_nn: [1, 3, 10, 20]
  attn_window: [13, 37]
  context_size: [1, 3, 15]
  feat_grid_size: [40, 80]
  center: [true]
