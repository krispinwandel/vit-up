# SPair-71k PCK, e.g.
#   python -m vit_up.eval_kits.correspondence_2d_toolkit.run_correspondence_2d model=dinov3_splus/vit_up
defaults:
  - /model@model: dinov3_splus/vit_up
  - _self_

dataset_dir: data/SPair-71k
output_dir: outputs/eval/spair
img_size: 448
out_size: 448
# Keep each category's normalized FP32 features on the inference device ("device") or on "cpu".
feature_cache_device: device
matching_query_chunk_size: 256
matching_target_chunk_size: 16384

hydra:
  searchpath:
    - pkg://vit_up.eval_kits.config
  run:
    dir: ${output_dir}/${hydra:runtime.choices.model}/${now:%Y-%m-%d_%H-%M-%S}
