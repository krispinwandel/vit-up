[project]
name = "vit_up"
version = "0.2.0"
description = "ViT-Up: Faithful Feature Upsampling for Vision Transformers"
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
    # Model and inference
    "torch==2.9.0",
    "torchvision==0.24.0",
    "transformers==5.17.0",
    "huggingface-hub==1.32.0",
    "safetensors==0.8.0",
    "peft==0.18.1",
    "hydra-core==1.3.2",
    "pyyaml",
    "numpy==2.0.2",
    "pillow==12.1.0",
    "opencv-python==4.12.0.88",
    "matplotlib==3.8.4",
    # Training
    "lightning==2.6.1",
    "datasets==4.5.0",
    # Evaluation
    "timm==1.0.25",
    "einops==0.8.1",
    "torchmetrics==1.9.0",
    "tensorboard==2.20.0",
    "rich",
    "tqdm",
    "albumentations==2.0.8",
    "scikit-learn==1.4.2",
    "natten==0.21.1+torch290cu128",
]

[project.optional-dependencies]
demo = ["jupyterlab", "ipywidgets==8.1.3", "clip @ git+https://github.com/openai/CLIP.git"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vit_up*", "hydra_plugins*"]

[tool.setuptools.package-data]
"vit_up.eval_kits.config" = ["**/*.yaml"]
"vit_up.eval_kits.upsamplers" = ["weights/**/*.pth"]

[tool.uv]
# Prebuilt NATTEN wheels (used by AnyUp).
find-links = ["https://whl.natten.org"]
